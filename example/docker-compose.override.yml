services:
  provisioner:
    image: ghcr.io/socheatsok78/netbirdio-provisioner:latest
    restart: no
    environment:
      # IMPORTANT: Ensure COMPOSE_PROJECT_NAME is set correctly
      #            The provisioner runs "docker compose" commands using this project name
      #            If not set, an error will occur
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    env_file:
      - ./proxy.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - provisioning-configs:/provisioning-configs
    depends_on:
      netbird-server:
        condition: service_started

  proxy:
    # Override the default image with a custom version
    image: ghcr.io/socheatsok78/netbirdio-reverse-proxy:latest
    volumes:
      - provisioning-configs:/provisioning-configs:ro
    depends_on:
      provisioner:
        condition: service_completed_successfully

volumes:
  provisioning-configs:
